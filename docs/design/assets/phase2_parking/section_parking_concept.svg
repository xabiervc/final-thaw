<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e1e6eb" stroke-width=".7"/></pattern>
    <marker id="dim" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#536273"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#182533}
      .title{font-size:23px;font-weight:700}
      .sub{font-size:13px;fill:#536273}
      .label{font-size:12px;font-weight:600}
      .small{font-size:10px}
      .tiny{font-size:9px}
      .concrete{fill:#d4dbe2;stroke:#344657;stroke-width:1.6}
      .metal{fill:#667887;stroke:#344657;stroke-width:1.5}
      .car{fill:#aab7c2;stroke:#405465;stroke-width:1.5}
      .glass{fill:#e8eef2;stroke:#627789;stroke-width:1}
      .dim{stroke:#536273;stroke-width:1;marker-start:url(#dim);marker-end:url(#dim)}
      .guide{stroke:#8996a3;stroke-width:1;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="48" y="42" class="title">FINAL THAW · PHASE 2 PARKING — SECTION B–B</text>
  <text x="48" y="65" class="sub">Concept v0.3 · representative north–south section across the parking rows · 30 m Z-depth · not runtime-verified</text>
  <g transform="translate(100 115)">
    <rect width="960" height="390" fill="url(#grid)"/>
    <!-- datum / pavement -->
    <line x1="0" y1="320" x2="960" y2="320" stroke="#344657" stroke-width="3"/>
    <rect x="0" y="320" width="960" height="22" fill="#dce2e7" stroke="#344657" stroke-width="1"/>
    <text x="480" y="414" class="small" text-anchor="middle">Pavimento continuo a Y=−2,0 m, alineado con P−1 en el baseline de diseño</text>
    <!-- south and north site limits -->
    <rect x="0" y="250" width="14" height="70" class="concrete"/>
    <text x="6" y="236" class="tiny" text-anchor="middle">SUR</text>
    <rect x="940" y="243" width="8" height="77" class="metal"/>
    <path d="M940 248H960 M940 264H960 M940 280H960 M940 296H960 M940 312H960" stroke="#667887" stroke-width="1"/>
    <text x="952" y="226" class="tiny" text-anchor="middle">NORTE</text>
    <!-- representative parking bay envelopes, each 5m deep -->
    <rect x="40" y="230" width="160" height="90" fill="none" stroke="#8996a3" stroke-dasharray="4 4"/>
    <rect x="754" y="230" width="160" height="90" fill="none" stroke="#8996a3" stroke-dasharray="4 4"/>
    <!-- vehicles: 4.5m length x approx 1.5m height, seen in profile -->
    <path d="M48 296 L58 278 L78 272 L168 272 L188 282 L192 296 Z" class="car"/>
    <rect x="82" y="276" width="37" height="14" class="glass"/><rect x="124" y="276" width="37" height="14" class="glass"/>
    <circle cx="76" cy="306" r="12" fill="#263849"/><circle cx="166" cy="306" r="12" fill="#263849"/>
    <path d="M762 296 L772 278 L792 272 L882 272 L902 282 L906 296 Z" class="car"/>
    <rect x="796" y="276" width="37" height="14" class="glass"/><rect x="838" y="276" width="37" height="14" class="glass"/>
    <circle cx="790" cy="306" r="12" fill="#263849"/><circle cx="880" cy="306" r="12" fill="#263849"/>
    <!-- canopy and columns -->
    <rect x="260" y="218" width="440" height="12" class="metal"/>
    <rect x="280" y="230" width="8" height="90" class="metal"/>
    <rect x="680" y="230" width="8" height="90" class="metal"/>
    <text x="480" y="207" class="label" text-anchor="middle">MARQUESINA DE SERVICIO (PROPUESTA OPCIONAL)</text>
    <line x1="715" y1="230" x2="715" y2="320" class="dim"/>
    <line x1="690" y1="230" x2="730" y2="230" class="guide"/><line x1="690" y1="320" x2="730" y2="320" class="guide"/>
    <text x="730" y="273" class="label">2,8 m</text><text x="730" y="288" class="tiny">altura libre</text>
    <!-- central apron landmark/light -->
    <line x1="480" y1="320" x2="480" y2="192" stroke="#344657" stroke-width="4"/>
    <path d="M480 192H510V202H480" class="metal"/>
    <path d="M490 203L565 310L415 310Z" fill="#f0d88b" fill-opacity=".18" stroke="#c5a54f" stroke-dasharray="5 4"/>
    <text x="480" y="181" class="small" text-anchor="middle">LUMINARIA / POOL DE EXPOSICIÓN</text>
    <!-- dimension strings -->
    <line x1="40" y1="350" x2="200" y2="350" class="dim"/>
    <line x1="40" y1="325" x2="40" y2="357" class="guide"/><line x1="200" y1="325" x2="200" y2="357" class="guide"/>
    <text x="120" y="344" class="label" text-anchor="middle">5,0 m</text>
    <line x1="200" y1="350" x2="754" y2="350" class="dim"/>
    <line x1="754" y1="325" x2="754" y2="357" class="guide"/>
    <text x="477" y="344" class="label" text-anchor="middle">17,3 m · APRON</text>
    <line x1="754" y1="350" x2="914" y2="350" class="dim"/>
    <line x1="914" y1="325" x2="914" y2="357" class="guide"/>
    <text x="834" y="344" class="label" text-anchor="middle">5,0 m</text>
    <line x1="0" y1="388" x2="960" y2="388" class="dim"/>
    <line x1="0" y1="347" x2="0" y2="398" class="guide"/><line x1="960" y1="347" x2="960" y2="398" class="guide"/>
    <text x="480" y="381" class="label" text-anchor="middle">30,0 m · profundidad total Z (escala horizontal 32 px/m)</text>
    <text x="24" y="170" class="tiny">LÍMITE SUR</text>
    <text x="930" y="170" class="tiny" text-anchor="end">LÍMITE NORTE</text>
  </g>
  <line x1="48" y1="555" x2="1152" y2="555" stroke="#d6dde4"/>
  <text x="48" y="582" class="label">ALCANCE Y LIMITACIONES</text>
  <text x="48" y="604" class="small">Este corte representa una sección típica a través de las filas de vehículos y el apron; no corta la boca de servicio ni la puerta de salida norte.</text>
  <text x="48" y="622" class="small">La boca de servicio entra sin rampa ni escalón a Y=−2,0 m; el egress norte conecta con un patio de servicio al mismo datum. Validar cotas y continuidad en Godot.</text>
  <text x="48" y="640" class="small">Alturas y marquesina son objetivos conceptuales. Validar colisiones, cámara, cobertura y luces en Godot antes de fijarlos.</text>
</svg>