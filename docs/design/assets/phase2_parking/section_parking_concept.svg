<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e1e6eb" stroke-width=".7"/></pattern>
    <marker id="dim" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#536273"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#182533}
      .title{font-size:23px;font-weight:700}
      .sub{font-size:13px;fill:#536273}
      .label{font-size:12px;font-weight:600}
      .small{font-size:10px}
      .tiny{font-size:9px}
      .concrete{fill:#d4dbe2;stroke:#344657;stroke-width:1.6}
      .metal{fill:#8799a6;stroke:#344657;stroke-width:1.5}
      .car{fill:#aab7c2;stroke:#405465;stroke-width:1.5}
      .glass{fill:#e8eef2;stroke:#627789;stroke-width:1}
      .obstacle{fill:#e7c27a;stroke:#94691e;stroke-width:1.5}
      .dim{stroke:#536273;stroke-width:1;marker-start:url(#dim);marker-end:url(#dim)}
      .guide{stroke:#8996a3;stroke-width:1;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="48" y="42" class="title">FINAL THAW · PHASE 2 PARKING — SECTION B–B</text>
  <text x="48" y="65" class="sub">Concept v0.3 · north–south section at local X≈36 m · cuts the pipe-rack supports and O2 service rack</text>
  <g transform="translate(100 115)">
    <rect width="960" height="390" fill="url(#grid)"/>
    <!-- 30 m clear yard, measured between inside faces of perimeter walls -->
    <line x1="0" y1="320" x2="960" y2="320" stroke="#344657" stroke-width="3"/>
    <rect x="0" y="320" width="960" height="22" fill="#dce2e7" stroke="#344657" stroke-width="1"/>
    <rect x="-10" y="243" width="10" height="77" class="concrete"/>
    <rect x="960" y="243" width="10" height="77" class="concrete"/>
    <text x="0" y="230" class="small" text-anchor="start">MURO DE CONTENCIÓN</text>
    <text x="960" y="230" class="small" text-anchor="end">MURO PERIMETRAL</text>
    <!-- South and north parking bays: 5 m deep, 4.5 m vehicle envelopes -->
    <line x1="42" y1="228" x2="202" y2="228" class="guide"/>
    <line x1="758" y1="228" x2="918" y2="228" class="guide"/>
    <path d="M52 300 L64 282 L86 272 L143 272 L166 282 L196 300 Z" class="car"/>
    <path d="M88 274 L99 274 L116 282 L82 282 Z" class="glass"/>
    <path d="M121 274 L141 274 L159 282 L121 282 Z" class="glass"/>
    <circle cx="82" cy="310" r="10" fill="#263849"/><circle cx="166" cy="310" r="10" fill="#263849"/>
    <path d="M768 300 L780 282 L802 272 L859 272 L882 282 L912 300 Z" class="car"/>
    <path d="M804 274 L815 274 L832 282 L798 282 Z" class="glass"/>
    <path d="M837 274 L857 274 L875 282 L837 282 Z" class="glass"/>
    <circle cx="798" cy="310" r="10" fill="#263849"/><circle cx="882" cy="310" r="10" fill="#263849"/>
    <text x="124" y="250" class="tiny" text-anchor="middle">VEHÍCULO · 4,5 m</text>
    <text x="840" y="250" class="tiny" text-anchor="middle">VEHÍCULO · 4,5 m</text>
    <!-- Pipe racks along the two inner parking-row edges; open air, no canopy -->
    <rect x="259" y="218" width="32" height="12" class="metal"/>
    <path d="M262 220H288 M262 224H288 M262 228H288" stroke="#e8eef2" stroke-width="1.2"/>
    <rect x="688" y="218" width="32" height="12" class="metal"/>
    <path d="M691 220H717 M691 224H717 M691 228H717" stroke="#e8eef2" stroke-width="1.2"/>
    <rect x="259" y="230" width="32" height="90" class="metal"/>
    <rect x="688" y="230" width="32" height="90" class="metal"/>
    <text x="480" y="202" class="label" text-anchor="middle">RACKS AÉREOS DE SERVICIO · PATIO ABIERTO, SIN CUBIERTA</text>
    <text x="275" y="211" class="tiny" text-anchor="middle">RACK</text>
    <text x="704" y="211" class="tiny" text-anchor="middle">RACK</text>
    <!-- O2 low service rack in the central apron -->
    <rect x="365" y="275" width="64" height="45" class="obstacle"/>
    <path d="M365 287H429 M365 299H429 M365 311H429" stroke="#94691e" stroke-width="1"/>
    <text x="397" y="268" class="label" text-anchor="middle">O2 · RACK BAJO</text>
    <text x="480" y="303" class="small" text-anchor="middle">APRON DE MANIOBRA EXPUESTO</text>
    <!-- Clear height below rack -->
    <line x1="744" y1="230" x2="744" y2="320" class="dim"/>
    <line x1="722" y1="230" x2="760" y2="230" class="guide"/>
    <line x1="722" y1="320" x2="760" y2="320" class="guide"/>
    <text x="758" y="268" class="label">2,8 m</text>
    <text x="758" y="282" class="tiny">libres bajo rack</text>
    <!-- Dimensions: 5 m bay / 17.3 m apron / 5 m bay -->
    <line x1="0" y1="355" x2="42" y2="355" class="dim"/><text x="21" y="348" class="tiny" text-anchor="middle">1,3 m</text><line x1="42" y1="355" x2="202" y2="355" class="dim"/>
    <text x="122" y="348" class="label" text-anchor="middle">5,0 m</text>
    <line x1="202" y1="370" x2="758" y2="370" class="dim"/>
    <text x="480" y="363" class="label" text-anchor="middle">17,3 m · APRON CENTRAL</text>
    <line x1="758" y1="355" x2="918" y2="355" class="dim"/>
    <text x="838" y="348" class="label" text-anchor="middle">5,0 m</text>
    <line x1="918" y1="355" x2="960" y2="355" class="dim"/><text x="939" y="348" class="tiny" text-anchor="middle">1,3 m</text><line x1="0" y1="385" x2="960" y2="385" class="dim"/>
    <line x1="0" y1="347" x2="0" y2="398" class="guide"/><line x1="960" y1="347" x2="960" y2="398" class="guide"/>
    <text x="480" y="378" class="label" text-anchor="middle">30,0 m · FONDO INTERIOR TOTAL</text>
    <text x="24" y="415" class="tiny">SUR</text><text x="936" y="415" class="tiny" text-anchor="end">NORTE</text>
  </g>
  <line x1="48" y1="555" x2="1152" y2="555" stroke="#d6dde4"/>
  <text x="48" y="582" class="label">CRITERIOS DE COORDINACIÓN</text>
  <text x="48" y="604" class="small">• El corte B–B pasa por X local≈36 m, dos soportes del rack aéreo y el obstáculo O2; las posiciones corresponden a la planta.</text>
  <text x="48" y="622" class="small">• No hay marquesina continua: el apron permanece abierto y expuesto. El objetivo de 2,8 m es la altura libre bajo los racks de servicio.</text>
  <text x="48" y="640" class="small">• Pavimento de parking a Y=−2,0 m, continuo con P−1; sin rampa ni escalón en la boca de servicio. Validar cota, colisiones y cámara en Godot.</text>
</svg>