<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e1e6eb" stroke-width=".7"/></pattern>
    <marker id="dim" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#536273"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#182533}
      .title{font-size:23px;font-weight:700}
      .sub{font-size:13px;fill:#536273}
      .label{font-size:12px;font-weight:600}
      .small{font-size:10px}
      .tiny{font-size:9px}
      .concrete{fill:#d4dbe2;stroke:#344657;stroke-width:1.6}
      .metal{fill:#667887;stroke:#344657;stroke-width:1.5}
      .car{fill:#aab7c2;stroke:#405465;stroke-width:1.5}
      .glass{fill:#e8eef2;stroke:#627789;stroke-width:1}
      .dim{stroke:#536273;stroke-width:1;marker-start:url(#dim);marker-end:url(#dim)}
      .guide{stroke:#8996a3;stroke-width:1;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="48" y="42" class="title">FINAL THAW · PHASE 2 PARKING — SECTION A–A</text>
  <text x="48" y="65" class="sub">Concept v0.1 · transverse section through service forecourt · heights provisional, ground datum unresolved</text>
  <g transform="translate(100 115)">
    <rect width="960" height="390" fill="url(#grid)"/>
    <!-- ground -->
    <line x1="0" y1="320" x2="960" y2="320" stroke="#344657" stroke-width="3"/>
    <rect x="0" y="320" width="960" height="22" fill="#dce2e7" stroke="#344657" stroke-width="1"/>
    <text x="480" y="365" class="label" text-anchor="middle">Pavimento industrial continuo · pendiente/drenaje por definir con la cota de salida P−1</text>
    <!-- facade and door -->
    <rect x="0" y="75" width="58" height="245" class="concrete"/>
    <rect x="58" y="215" width="96" height="105" fill="#ffffff" stroke="#344657" stroke-width="2"/>
    <line x1="58" y1="215" x2="154" y2="215" stroke="#278c83" stroke-width="4"/>
    <text x="29" y="170" class="label" text-anchor="middle" transform="rotate(-90 29 170)">FACHADA</text>
    <text x="106" y="250" class="small" text-anchor="middle">SALIDA</text><text x="106" y="264" class="small" text-anchor="middle">SERVICIO · 3 m</text>
    <!-- canopy -->
    <rect x="170" y="110" width="480" height="12" class="metal"/>
    <rect x="190" y="122" width="8" height="198" class="metal"/>
    <rect x="620" y="122" width="8" height="198" class="metal"/>
    <text x="410" y="99" class="label" text-anchor="middle">MARQUESINA / ZONA DE CARGA (OPCIONAL, PROPUESTA)</text>
    <!-- clearance dimension -->
    <line x1="660" y1="122" x2="660" y2="320" class="dim"/>
    <line x1="634" y1="122" x2="675" y2="122" class="guide"/><line x1="634" y1="320" x2="675" y2="320" class="guide"/>
    <text x="677" y="218" class="label">2,8 m</text><text x="677" y="233" class="tiny">altura libre</text>
    <!-- vehicle 1 -->
    <path d="M215 278 L230 250 L265 237 L340 237 L366 253 L385 278 Z" class="car"/>
    <rect x="270" y="242" width="57" height="18" class="glass"/><rect x="332" y="242" width="22" height="18" class="glass"/>
    <circle cx="250" cy="280" r="13" fill="#263849"/><circle cx="350" cy="280" r="13" fill="#263849"/>
    <text x="300" y="306" class="tiny" text-anchor="middle">VEHÍCULO ESTÁTICO</text>
    <!-- vehicle 2 -->
    <path d="M430 278 L445 250 L480 237 L555 237 L581 253 L600 278 Z" class="car"/>
    <rect x="485" y="242" width="57" height="18" class="glass"/><rect x="547" y="242" width="22" height="18" class="glass"/>
    <circle cx="465" cy="280" r="13" fill="#263849"/><circle cx="565" cy="280" r="13" fill="#263849"/>
    <!-- pillar -->
    <rect x="400" y="175" width="16" height="145" class="metal"/>
    <text x="408" y="164" class="small" text-anchor="middle">PILAR</text>
    <!-- light -->
    <line x1="740" y1="320" x2="740" y2="85" stroke="#344657" stroke-width="5"/>
    <path d="M740 85 h40 v12 h-40" class="metal"/>
    <path d="M750 100 L810 230 L690 230 Z" fill="#f0d88b" opacity=".22" stroke="#d5b65d" stroke-dasharray="5 4"/>
    <text x="740" y="70" class="small" text-anchor="middle">LUMINARIA</text>
    <!-- perimeter fence -->
    <rect x="900" y="120" width="8" height="200" class="metal"/>
    <path d="M900 125 H960 M900 145 H960 M900 165 H960 M900 185 H960 M900 205 H960 M900 225 H960 M900 245 H960 M900 265 H960 M900 285 H960 M900 305 H960" stroke="#667887" stroke-width="1"/>
    <text x="930" y="105" class="small" text-anchor="middle">PERÍMETRO</text>
    <!-- overall width dimension -->
    <line x1="0" y1="385" x2="960" y2="385" class="dim"/>
    <line x1="0" y1="347" x2="0" y2="398" class="guide"/><line x1="960" y1="347" x2="960" y2="398" class="guide"/>
    <text x="480" y="378" class="label" text-anchor="middle">30 m de ancho total (solo como referencia de planta)</text>
  </g>
  <line x1="48" y1="555" x2="1152" y2="555" stroke="#d6dde4"/>
  <text x="48" y="582" class="label">PENDIENTES DE CIERRE</text>
  <text x="48" y="604" class="small">1. Confirmar cota del exterior respecto a P−1 antes de fijar rampa, escalón o drenaje; este corte no los inventa.</text>
  <text x="48" y="622" class="small">2. Confirmar si existe marquesina; si no, eliminarla sin alterar rutas ni líneas de visión.</text>
  <text x="48" y="640" class="small">3. Validar alturas, cámara, colisiones, luces y cobertura en Godot. Este dibujo no demuestra comportamiento en runtime.</text>
</svg>