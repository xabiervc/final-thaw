  <text x="48" y="710" class="small">Selected design baseline: Phase 1 P−1 service gallery exits east at world X=34, Z=4.5..7.5, Y=−2.0 m. Parking local coordinates: X east/right, Z south/down, origin northwest inside corner, 14 px/m. Transform: world X = local X + 28.7 m; world Z = local Z − 15.8 m. The 3.0 m threshold plane (local X≈5.3, Z≈21.8) maps to world (34, 6); safe spawn (local X≈6.8, Z≈21.8) maps to (35.5, 6); far egress (local X≈42.8, Z≈1.8) maps to (71.5, −14). Pavement datum Y=−2.0 m. Verify against scene geometry before implementation.</text>
