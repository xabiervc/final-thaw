<line x1="48" y1="55" x2="184" y2="55" class="dim"/><text x="116" y="47" class="small" text-anchor="middle">3.4 m overall</text>
<line x1="90" y1="72" x2="142" y2="72" class="dim"/><text x="116" y="66" class="small" text-anchor="middle">1.3 m</text>
<line x1="200" y1="82" x2="200" y2="170" class="dim"/><text x="208" y="123" class="label">2.2 m</text>
<text x="48" y="190" class="tiny">Hojas fijas a ambos lados · mantener la apertura despejada</text></g>
<line x1="42" y1="700" x2="1158" y2="700" stroke="#d5dde4"/>
<text x="42" y="726" class="label">REGLAS DE ACEPTACIÓN</text>
<text x="42" y="748" class="small">1. Elena y la unidad atraviesan O3 sin roce/cámara atrapada; la abertura real nunca baja de 1.3 × 2.2 m.</text>
<text x="42" y="766" class="small">2. O1/O2 son estáticos. Cualquier cambio de footprint, altura o bypass exige actualizar planta, sección, grafo y esta ficha.</text>
<text x="42" y="784" class="small">3. Este dibujo especifica intención, no prueba de colisiones ni runtime. Verificar medidas con jugador/cámara reales en Godot.</text>
</svg>