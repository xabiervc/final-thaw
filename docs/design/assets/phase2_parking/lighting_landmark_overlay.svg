<g transform="translate(830 130)"><text x="0" y="0" class="lab">LEYENDA</text><rect x="0" y="24" width="22" height="16" class="cool"/><text x="32" y="36" class="sm">Luz fría / orientación</text><rect x="0" y="52" width="22" height="16" class="warm"/><text x="32" y="64" class="sm">Luz de seguridad / exposición</text><circle cx="11" cy="91" r="8" class="landmark"/><text x="32" y="95" class="sm">Landmark legible desde ruta</text><text x="0" y="142" class="lab">CADENA DE LECTURA</text><text x="0" y="164" class="sm">L1 · Boca de servicio iluminada,</text><text x="0" y="180" class="sm">   orientación inicial y respiro corto.</text><text x="0" y="203" class="sm">L2 · Primera zona de cobertura;</text><text x="0" y="219" class="sm">   siluetas de columnas y coches.</text><text x="0" y="242" class="sm">L3 · Bypass de jaula técnica; indicador</text><text x="0" y="258" class="sm">   de servicio visible; no ocultar el suelo.</text><text x="0" y="281" class="sm">L4 · Zona de convergencia/barrera;</text><text x="0" y="297" class="sm">   el objetivo debe seguir visible.</text><text x="0" y="320" class="sm">L5 · Egress; visible pronto, no seguro</text><text x="0" y="336" class="sm">   hasta cruzar el umbral físico.</text><text x="0" y="385" class="lab">REGLAS DE LEGIBILIDAD</text><text x="0" y="407" class="sm">• No usar color como único código.</text><text x="0" y="425" class="sm">• Evitar flashing rojo continuo.</text><text x="0" y="443" class="sm">• No esconder bordillos/colisiones.</text><text x="0" y="461" class="sm">• El sonido crítico tiene equivalente</text><text x="0" y="477" class="sm">  visual; el objetivo no depende del audio.</text><text x="0" y="520" class="lab">ESTADO</text><text x="0" y="542" class="sm">Las elipses son zonas de intención,</text><text x="0" y="559" class="sm">no valores de lux ni focos colocados.</text><text x="0" y="576" class="sm">La iluminación real debe revisarse</text><text x="0" y="592" class="sm">desde cámara de juego en runtime.</text></g>
<line x1="48" y1="685" x2="1072" y2="685" stroke="#d6dde4"/><text x="48" y="710" class="sm">Selected design baseline: Phase 1 P−1 service mouth at world X=34, Z=4.5..7.5, Y=−2.0 m. Local transform: world X = local X + 28.7 m; world Z = local Z − 15.8 m. Threshold local (5.3, 21.8) maps to world (34, 6); recovery checkpoint local (6.8, 21.8) maps to (35.5, 6); handoff remains at threshold (34, 6); far egress threshold local (42.8, −0.4) maps to (71.5, −16.2). Lighting/landmark locations remain proposals; runtime verification pending.</text><text x="48" y="730" class="sm">Validate route visibility, cover silhouettes, contrast, camera exposure and accessibility in the actual renderer.</text></svg>