      <text x="877" y="150" font-size="15" font-weight="700" fill="#edf4f7">Llegada del elevador</text>
      <text x="877" y="173" font-size="12" fill="#b4c7d1">El transporte termina aquí;</text>
      <text x="877" y="192" font-size="12" fill="#b4c7d1">no lleva directamente a control; también es retorno de huida.</text><circle cx="855" cy="273" r="11" fill="#f4c968"/><text x="855" y="277" font-size="11" text-anchor="middle" font-weight="800" fill="#0b151d">2</text>
