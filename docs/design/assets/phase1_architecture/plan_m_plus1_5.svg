      <text x="877" y="310" font-size="12" fill="#b4c7d1">y banco hacen útil este espacio.</text><circle cx="855" cy="391" r="11" fill="#76c8e6"/><text x="855" y="395" font-size="11" text-anchor="middle" font-weight="800" fill="#0b151d">3</text>
