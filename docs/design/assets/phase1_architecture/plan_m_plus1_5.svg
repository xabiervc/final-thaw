      <text x="877" y="409" font-size="12" fill="#b4c7d1">La barandilla abre vista a B;</text>
      <text x="877" y="428" font-size="12" fill="#b4c7d1">explica los niveles de la instalación.</text><circle cx="855" cy="509" r="11" fill="#e9a078"/><text x="855" y="513" font-size="11" text-anchor="middle" font-weight="800" fill="#0b151d">4</text>
