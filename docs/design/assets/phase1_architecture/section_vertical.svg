<line x1="400" y1="222" x2="400" y2="486" stroke="#287a68" stroke-width="2"/>
<line x1="390" y1="222" x2="410" y2="222" stroke="#287a68" stroke-width="2"/>
<line x1="390" y1="486" x2="410" y2="486" stroke="#287a68" stroke-width="2"/>
<text x="388" y="350" transform="rotate(-90 388 350)" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#287a68">6–8 m DE ALTURA LIBRE OBJETIVO</text>
<!-- Basement cross-section: spares then dead workshop then transfer door -->
<rect x="150" y="515" width="250" height="120" fill="#e9eff1" stroke="#53646e" stroke-width="1.5"/>
<text x="275" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1c2b33"><tspan x="275">ALMACÉN DE REPUESTOS</tspan><tspan x="275" dy="17" font-size="10">ARMARIO SECO / TRANSFER_KEY</tspan></text>
<rect x="410" y="515" width="255" height="120" fill="#f2e0dc" stroke="#b6534b" stroke-width="2"/>
<text x="537" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6d302d"><tspan x="537">TALLER MUERTO</tspan><tspan x="537" dy="17" font-size="10">PUERTA OCULTA EN MURO ESTE</tspan></text>
<rect x="675" y="515" width="265" height="120" fill="#dce8f1" stroke="#53646e" stroke-width="1.5"/>
<text x="807" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1c2b33"><tspan x="807">BOMBAS / SUBESTACIÓN</tspan><tspan x="807" dy="17" font-size="10">SERVICE_KEY + PUENTE</tspan></text>
<path d="M665 570 H975" stroke="#b6534b" stroke-width="5"/>
<rect x="975" y="520" width="155" height="105" fill="#f4dfcf" stroke="#b6534b" stroke-width="2.5"/>
<text x="1052" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#6d302d"><tspan x="1052">VESTÍBULO</tspan><tspan x="1052" dy="15">TÉCNICO</tspan><tspan x="1052" dy="17" font-size="9">SEGUNDO EDIFICIO</tspan></text>
<text x="1085" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#9d413b">PUERTA DE TRANSFERENCIA</text>
<!-- Right-side section notes -->
<text x="985" y="125" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#16212a">CRITERIOS DE SECCIÓN</text>
<text x="985" y="155" font-family="Arial,sans-serif" font-size="11" fill="#53616d"><tspan x="985">• La nave no recibe forjado</tspan><tspan x="997" dy="16">en M ni en P+3.</tspan><tspan x="985" dy="26">• M y P+3 son alas parciales.</tspan><tspan x="985" dy="26">• P−2 y P0 se separan 4 m</tspan><tspan x="997" dy="16">entre cotas de suelo.</tspan><tspan x="985" dy="26">• Las alturas ordinarias se</tspan><tspan x="997" dy="16">validan en el greybox.</tspan></text>
<text x="42" y="755" font-family="Arial,sans-serif" font-size="11" fill="#71808a">FINAL THAW · DISEÑO OBJETIVO · 2026-10-16 · COTAS Y ALTURAS A VALIDAR EN GODOT · NO ES PLANO CONSTRUCTIVO</text>
</svg>