<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 800" role="img" aria-label="Sección vertical de cuatro cotas de Final Thaw Fase 1">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7be0b8"/></marker><marker id="lift" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f4c968"/></marker></defs>
<style>text{font-family:Inter,Arial,sans-serif;fill:#eaf2f6}.title{font-size:26px;font-weight:750}.sub{font-size:15px;fill:#a9c0cc}.level{font-size:15px;font-weight:750;fill:#7be0b8}.lab{font-size:14px;font-weight:700}.body{font-size:12px;fill:#b6c9d3}.datum{stroke:#829eae;stroke-width:1;opacity:.25}.walk{stroke:#7be0b8;stroke-width:4;fill:none;marker-end:url(#arrow)}.liftpath{stroke:#f4c968;stroke-width:4;fill:none;stroke-dasharray:8 6;marker-end:url(#lift)}</style>
<rect width="1330" height="800" fill="#0b141d"/><path d="M0 91H1330M0 720H1330" stroke="#324b5a"/>
<text x="32" y="39" class="title">FINAL THAW · FASE 1</text><text x="32" y="64" class="sub">SECCIÓN VERTICAL · CUATRO COTAS CON DESTINOS DIFERENTES</text><text x="32" y="84" class="level">S1: foso · elevador: mezzanine · S2: control</text>
<line x1="100" y1="180" x2="1210" y2="180" class="datum"/><text x="88" y="171" text-anchor="end" class="level">P2  +3,0 m</text><line x1="100" y1="320" x2="1210" y2="320" class="datum"/><text x="88" y="311" text-anchor="end" class="level">M  +1,5 m</text><line x1="100" y1="455" x2="1210" y2="455" class="datum"/><text x="88" y="446" text-anchor="end" class="level">P0  0,0 m</text><line x1="100" y1="605" x2="1210" y2="605" class="datum"/><text x="88" y="596" text-anchor="end" class="level">P−1  −2,0 m</text>
<rect x="150" y="440" width="890" height="22" fill="#1b303c" stroke="#8aa7b6" stroke-width="2"/>
<rect x="175" y="402" width="125" height="38" fill="#193943" stroke="#76a0b4"/><text x="237" y="425" text-anchor="middle" class="body">A · Acceso</text>
<rect x="300" y="390" width="440" height="50" fill="#1a303c" stroke="#76a0b4"/><text x="520" y="411" text-anchor="middle" class="lab">B · Nave de ensayo</text><text x="520" y="429" text-anchor="middle" class="body">Rig y columna Aster</text>
<rect x="740" y="402" width="145" height="38" fill="#253541" stroke="#76a0b4"/><text x="812" y="425" text-anchor="middle" class="body">C · Taller</text>
<rect x="360" y="590" width="495" height="37" fill="#1b3440" stroke="#6f97a8" stroke-width="2"/><text x="605" y="613" text-anchor="middle" class="lab">D1 / D2 · Foso y distribución</text>
<rect x="475" y="320" width="405" height="12" fill="#263640" stroke="#8aa7b6" stroke-width="2"/>
<rect x="490" y="282" width="110" height="38" fill="#203743" stroke="#76a0b4"/><text x="545" y="304" text-anchor="middle" class="body">Galería</text>
<rect x="600" y="282" width="255" height="38" fill="#253640" stroke="#76a0b4"/><text x="727" y="305" text-anchor="middle" class="lab">M · Sala de bombas</text>
<rect x="490" y="180" width="20" height="210" fill="#112630" stroke="#f4c968" stroke-width="2"/><rect x="478" y="195" width="44" height="8" fill="#f4c968"/><rect x="478" y="290" width="44" height="8" fill="#f4c968"/><rect x="478" y="382" width="44" height="8" fill="#7be0b8"/><text x="535" y="255" class="body">Columna Aster</text><text x="535" y="272" class="body">hito visual continuo</text>
<rect x="170" y="168" width="120" height="12" fill="#3a302f" stroke="#8aa7b6"/><rect x="290" y="168" width="180" height="12" fill="#213943" stroke="#8aa7b6"/><rect x="510" y="168" width="500" height="12" fill="#233541" stroke="#8aa7b6"/>
<text x="230" y="152" text-anchor="middle" class="lab">G · Esclusa</text><text x="380" y="152" text-anchor="middle" class="lab">F · Archivo</text><text x="760" y="152" text-anchor="middle" class="lab">E · Control / pasarela</text>
<!-- S1 -->
<path d="M825 440L805 458L785 477L765 495L745 512L725 530L705 548L685 565L665 588" stroke="#9ab4c2" stroke-width="5" fill="none"/><path d="M820 445L665 585" class="walk"/><text x="835" y="525" class="lab">S1 · Escalera fija</text><text x="835" y="543" class="body">P0 ↔ D · siempre operativa</text>
<!-- Lift P0 to M only -->
<rect x="950" y="330" width="68" height="132" fill="#132632" stroke="#76c8e6" stroke-width="2"/><rect x="958" y="324" width="52" height="12" fill="#76c8e6" opacity=".55"/><rect x="958" y="448" width="52" height="12" fill="#76c8e6" opacity=".55"/><path d="M984 450L984 330" class="liftpath"/><text x="1030" y="370" class="lab">Elevador</text><text x="1030" y="388" class="body">P0 ↔ M</text><text x="1030" y="406" class="body">Y=0 ↔ +1,5 m</text>
