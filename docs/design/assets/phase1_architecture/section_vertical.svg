<path d="M475 320L455 302L435 285L415 267L395 250L375 232L355 213L330 180" stroke="#9ab4c2" stroke-width="5" fill="none"/><path d="M475 320L330 180" class="walk"/><text x="260" y="251" class="lab">S2 · Escalera fija</text><text x="260" y="269" class="body">M ↔ P2 · +1,5 ↔ +3 m</text>
<!-- collapsed stair -->
<path d="M195 440L220 420L245 397L270 375" stroke="#e9a17e" stroke-width="4" stroke-dasharray="8 6" fill="none"/><path d="M258 365L282 389M282 365L258 389" stroke="#e9a17e" stroke-width="3"/><text x="105" y="350" class="lab" fill="#e9a17e">P0→P2 dañada</text><text x="105" y="368" class="body">no transitable</text>
<path d="M235 420L360 420L520 420L790 420L835 390L930 350L730 305L495 305L400 240L620 175L380 175L230 175" class="walk"/>
<text x="32" y="754" class="sub">Sección conceptual coordinada con plantas v1.1. B termina al norte del hueco D1/D2; S1, elevador y S2 tienen destinos distintos. Geometría, cámara y colisiones pendientes de Godot.</text>
</svg>