<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 800" role="img" aria-label="PLANTA P0 · ENTRADA, INVESTIGACIÓN Y NAVE"><defs><pattern id="grid" width="15.5" height="15.5" patternUnits="userSpaceOnUse"><path d="M15.5 0H0V15.5" fill="none" stroke="#dce3e8" stroke-width=".55"/></pattern></defs><rect width="100%" height="100%" fill="#f8fafb"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#16212a">PLANTA P0 · ENTRADA, INVESTIGACIÓN Y NAVE</text><text x="42" y="76" font-family="Arial,sans-serif" font-size="14" fill="#53616d">Nave de laboratorio de 6–8 m de altura libre; dos accesos distintos y puzle de investigación.</text><text x="92" y="118" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#24333c">P0 · SUELO ±0,00 · ALTURA LIBRE DE LA NAVE 6–8 m · ESQUEMA CONCEPTUAL</text><rect x="92" y="145" width="744" height="527" fill="url(#grid)" stroke="#17242c" stroke-width="5"/><rect x="138.5" y="377.5" width="651" height="62" fill="#e6edf0" stroke="#596b76" stroke-width="1.6"/><text x="464" y="415.47499999999997" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#465762">ESPINA DE CIRCULACIÓN · 4 m</text><rect x="123" y="176" width="108.5" height="186" rx="2" fill="#d9e9e4" stroke="#263943" stroke-width="2.6"/><text x="177.25" y="260.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#1c2b33"><tspan x="177.25" dy="0">BRECHA DE</tspan><tspan x="177.25" dy="16.25">ELENA</tspan><tspan x="177.25" dy="16.25">COLAPSADA</tspan></text><rect x="231.5" y="176" width="108.5" height="186" rx="2" fill="#e9eff1" stroke="#53646e" stroke-width="1.3"/><text x="285.75" y="260.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#1c2b33"><tspan x="285.75" dy="0">ESCLUSA</tspan><tspan x="285.75" dy="16.25">DE ACCESO</tspan></text><rect x="340" y="176" width="108.5" height="186" rx="2" fill="#e9eff1" stroke="#53646e" stroke-width="1.3"/><text x="394.25" y="269" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#1c2b33"><tspan x="394.25" dy="0">VESTUARIOS</tspan></text><rect x="448.5" y="176" width="124" height="186" rx="2" fill="#f5e7c7" stroke="#263943" stroke-width="2.6"/><text x="510.5" y="261.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1c2b33"><tspan x="510.5" dy="0">ARCHIVO DE TURNO</tspan><tspan x="510.5" dy="15.625">PISTA DEL CÓDIGO</tspan></text><rect x="572.5" y="176" width="108.5" height="186" rx="2" fill="#f4dfcf" stroke="#263943" stroke-width="2.6"/><text x="626.75" y="260.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#1c2b33"><tspan x="626.75" dy="0">DESPACHO</tspan><tspan x="626.75" dy="16.25">CAJÓN CERRADO</tspan></text><rect x="681" y="176" width="108.5" height="186" rx="2" fill="#e9eff1" stroke="#53646e" stroke-width="1.3"/><text x="735.25" y="260.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#1c2b33"><tspan x="735.25" dy="0">CUARTO DE</tspan><tspan x="735.25" dy="16.25">LIMPIEZA</tspan></text><rect x="123" y="455" width="108.5" height="186" rx="2" fill="#e9eff1" stroke="#53646e" stroke-width="1.3"/><text x="177.25" y="540.25" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.5" font-weight="500" fill="#1c2b33"><tspan x="177.25" dy="0">SALA DE ESPERA</tspan><tspan x="177.25" dy="15.625">AMBIENTAL</tspan></text><rect x="231.5" y="455" width="108.5" height="186" rx="2" fill="#e9eff1" stroke="#53646e" stroke-width="1.3"/><text x="285.75" y="539.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#1c2b33"><tspan x="285.75" dy="0">DESCANSO</tspan><tspan x="285.75" dy="16.25">DEL PERSONAL</tspan></text><rect x="340" y="455" width="108.5" height="186" rx="2" fill="#e9eff1" stroke="#53646e" stroke-width="1.3"/><text x="394.25" y="539.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#1c2b33"><tspan x="394.25" dy="0">ALMACÉN</tspan><tspan x="394.25" dy="16.25">SECUNDARIO</tspan></text><rect x="448.5" y="455" width="124" height="186" rx="2" fill="#dce8f1" stroke="#263943" stroke-width="2.6"/><text x="510.5" y="539.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#1c2b33"><tspan x="510.5" dy="0">NAVE CENTRAL</tspan><tspan x="510.5" dy="16.25">COLUMNA ASTER</tspan></text><rect x="572.5" y="455" width="108.5" height="186" rx="2" fill="#e9eff1" stroke="#53646e" stroke-width="1.3"/><text x="626.75" y="540.7666666666667" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.666666666666666" font-weight="500" fill="#1c2b33"><tspan x="626.75" dy="0">TALLER</tspan><tspan x="626.75" dy="14.583333333333332">DE INSTRUMENTOS</tspan></text><rect x="681" y="455" width="108.5" height="186" rx="2" fill="#e9eff1" stroke="#53646e" stroke-width="1.3"/><text x="735.25" y="539.94" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#1c2b33"><tspan x="735.25" dy="0">LAVADO</tspan><tspan x="735.25" dy="16.25">Y MUESTRAS</tspan></text><rect x="743" y="455" width="46.5" height="186" rx="2" fill="#d9e9e4" stroke="#263943" stroke-width="2.6"/><text x="766.25" y="542.1875" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.375" font-weight="700" fill="#1c2b33"><tspan x="766.25" dy="0">NÚCLEO</tspan><tspan x="766.25" dy="11.71875">ASCENSOR</tspan></text><path d="M74 408.5H138.5" stroke="#287a68" stroke-width="4" stroke-dasharray="6 4"/><text x="138.5" y="369" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#287a68">ACCESO AL PASILLO</text><text x="836" y="690" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#53616d">48 m × 34 m · huella bruta propuesta: 1.632 m²</text><text x="900" y="145" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16212a">LECTURA DEL NIVEL</text><circle cx="908" cy="176" r="4" fill="#8fc7b8"/><text x="923" y="180" font-family="Arial,sans-serif" font-size="13" fill="#273943">La brecha de Elena se colapsa tras entrar; el acceso al pasillo es distinto.</text><circle cx="908" cy="233" r="4" fill="#8fc7b8"/><text x="923" y="237" font-family="Arial,sans-serif" font-size="13" fill="#273943">La pizarra de turnos y la tira de presión permiten deducir el código del cajón.</text><circle cx="908" cy="290" r="4" fill="#8fc7b8"/><text x="923" y="294" font-family="Arial,sans-serif" font-size="13" fill="#273943">El cajón contiene la llave de servicio y el puente aislado.</text><circle cx="908" cy="347" r="4" fill="#8fc7b8"/><text x="923" y="351" font-family="Arial,sans-serif" font-size="13" fill="#273943">Varias salas son ambientales y no contienen objetos críticos.</text><circle cx="908" cy="404" r="4" fill="#8fc7b8"/><text x="923" y="408" font-family="Arial,sans-serif" font-size="13" fill="#273943">El ascensor se ve desde la nave, pero comienza sin energía.</text><line x1="900" y1="545" x2="1275" y2="545" stroke="#ccd5da"/><text x="900" y="572" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#16212a">NOTA DE VALIDACIÓN</text><text x="900" y="598" font-family="Arial,sans-serif" font-size="12" fill="#53616d"><tspan x="900">Esquema de zonificación, no plano</tspan><tspan x="900" dy="18">constructivo. Conexiones, puertas,</tspan><tspan x="900" dy="18">colisiones, alturas y superficie útil</tspan><tspan x="900" dy="18">se comprobarán en el greybox Godot.</tspan></text><text x="42" y="765" font-family="Arial,sans-serif" font-size="11" fill="#71808a">FINAL THAW · REDISEÑO ESPACIAL PROPUESTO · 2026-10-16 · NO ES PLANO DE EJECUCIÓN</text></svg>