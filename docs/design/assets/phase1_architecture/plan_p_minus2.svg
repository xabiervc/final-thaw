  <circle cx="855" cy="155" r="11" fill="#7be0b8"/><text x="855" y="159" font-size="11" text-anchor="middle" font-weight="800" fill="#0b151d">1</text>
      <text x="877" y="150" font-size="15" font-weight="700" fill="#edf4f7">D1 · Galería de achique</text>
      <text x="877" y="173" font-size="12" fill="#b4c7d1">Bombas, sumidero, colector y</text>
      <text x="877" y="192" font-size="12" fill="#b4c7d1">marcas de marea del deshielo.</text><circle cx="855" cy="273" r="11" fill="#f4c968"/><text x="855" y="277" font-size="11" text-anchor="middle" font-weight="800" fill="#0b151d">2</text>
      <text x="877" y="268" font-size="15" font-weight="700" fill="#edf4f7">D2 · Distribución</text>
      <text x="877" y="291" font-size="12" fill="#b4c7d1">El esquema muestra la intención;</text>
      <text x="877" y="310" font-size="12" fill="#b4c7d1">el puente físico revela el desvío A→T.</text><circle cx="855" cy="391" r="11" fill="#76c8e6"/><text x="855" y="395" font-size="11" text-anchor="middle" font-weight="800" fill="#0b151d">3</text>
      <text x="877" y="386" font-size="15" font-weight="700" fill="#edf4f7">Mantenimiento</text>
      <text x="877" y="409" font-size="12" fill="#b4c7d1">Al final del recorrido: restaura</text>
      <text x="877" y="428" font-size="12" fill="#b4c7d1">luces y habilita el elevador.</text><circle cx="855" cy="509" r="11" fill="#e9a078"/><text x="855" y="513" font-size="11" text-anchor="middle" font-weight="800" fill="#0b151d">4</text>
      <text x="877" y="504" font-size="15" font-weight="700" fill="#edf4f7">Salida segura</text>
      <text x="877" y="527" font-size="12" fill="#b4c7d1">S1 vuelve a P0 sin alimentación.</text>
      <text x="877" y="546" font-size="12" fill="#b4c7d1">Las pistas no son llaves obligatorias.</text>
