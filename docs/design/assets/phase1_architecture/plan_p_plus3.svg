e="17" font-weight="700" fill="#16212a">LECTURA DEL NIVEL</text><circle cx="908" cy="176" r="4" fill="#8fc7b8"/><text x="923" y="180" font-family="Arial,sans-serif" font-size="13" fill="#273943">Archivo y seguridad aportan contexto sin otra cadena de llaves.</text><circle cx="908" cy="233" r="4" fill="#8fc7b8"/><text x="923" y="237" font-family="Arial,sans-serif" font-size="13" fill="#273943">El laboratorio sellado anticipa narrativa, no bloquea la misión.</text><circle cx="908" cy="290" r="4" fill="#8fc7b8"/><text x="923" y="294" font-family="Arial,sans-serif" font-size="13" fill="#273943">La salida de emergencia enlaza con el recorrido de Fase 2.</text><circle cx="908" cy="347" r="4" fill="#8fc7b8"/><text x="923" y="351" font-family="Arial,sans-serif" font-size="13" fill="#273943">Los accesos dibujados deben comprobarse en Godot.</text><circle cx="908" cy="404" r="4" fill="#8fc7b8"/><text x="923" y="408" font-family="Arial,sans-serif" font-size="13" fill="#273943">La planta superior no se considera construida todavía.</text><line x1="900" y1="545" x2="1275" y2="545" stroke="#ccd5da"/><text x="900" y="572" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#16212a">NOTA DE VALIDACIÓN</text><text x="900" y="598" font-family="Arial,sans-serif" font-size="12" fill="#53616d"><tspan x="900">Esquema de zonificación, no plano</tspan><tspan x="900" dy="18">constructivo. Conexiones, puertas,</tspan><tspan x="900" dy="18">colisiones, alturas y superficie útil</tspan><tspan x="900" dy="18">se comprobarán en el greybox Godot.</tspan></text><rect x="330" y="145" width="300" height="527" fill="#f8fafb" stroke="#8d9ba3" stroke-width="2" stroke-dasharray="9 6"/><text x="480" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#53616d"><tspan x="480">VACÍO SOBRE</tspan><tspan x="480" dy="20">NAVE CENTRAL</tspan><tspan x="480" dy="24" font-size="11">SIN FORJADO</tspan></text><text x="42" y="765" font-family="Arial,sans-serif" font-size="11" fill="#71808a">FINAL THAW · REDISEÑO ESPACIAL PROPUESTO · 2026-10-16 · NO ES PLANO DE EJECUCIÓN</text></svg>