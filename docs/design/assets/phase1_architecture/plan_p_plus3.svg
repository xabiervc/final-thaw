      <text x="877" y="173" font-size="12" fill="#b4c7d1">Selector, aislador, diagnóstico</text>
      <text x="877" y="192" font-size="12" fill="#b4c7d1">y rearme dentro de una sala propia.</text><circle cx="855" cy="273" r="11" fill="#f4c968"/><text x="855" y="277" font-size="11" text-anchor="middle" font-weight="800" fill="#0b151d">2</text>
