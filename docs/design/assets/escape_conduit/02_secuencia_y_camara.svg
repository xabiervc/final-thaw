<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1800" height="1400" viewBox="0 0 1800 1400"><title>SECUENCIA NARRATIVA, PERSONAJES Y CÁMARA</title><desc>FINAL THAW. Reconstrucción vectorial editable. Propuesta de diseño, no plano constructivo.</desc>
<rect width="1800" height="1400" fill="#faf9f5"/>
<text x="45" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#172838">FINAL THAW</text>
<text x="45" y="82" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#172838">SECUENCIA NARRATIVA, PERSONAJES Y CÁMARA</text>
<text x="45" y="110" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#526677">Tres trabajadores distintos de dos guardias. La alarma depende de una acción humana, no del mueble ni de un sensor.</text>
<rect x="45" y="155" width="1710" height="113" fill="white" stroke="#d3dbe0" stroke-width="1" rx="6"/>
<rect x="45" y="155" width="9" height="113" fill="#cf343f" stroke="none" stroke-width="1" />
<text x="70" y="185" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#cf343f">T0 · ENCUENTRO</text>
<text x="70" y="212" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#172838">N1 · 3 trabajadores · alarma APAGADA</text>
<text x="505" y="185" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">Elena llega desde S. Los trabajadores cierran el frente; la única huida es a la izquierda, por B. No sustituirlos por</text>
<text x="505" y="207" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">guardias.</text>
<rect x="45" y="278" width="1710" height="113" fill="white" stroke="#d3dbe0" stroke-width="1" rx="6"/>
<rect x="45" y="278" width="9" height="113" fill="#1878c9" stroke="none" stroke-width="1" />
<text x="70" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#1878c9">T1 · ESTANTERÍA</text>
<text x="70" y="335" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#172838">X azul · interacción ambiental 1</text>
<text x="505" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">Aviso de interacción. Elena derriba la estantería. T1 tropieza; T2 y T3 saltan y siguen persiguiendo. Plano corto que muestra</text>
<text x="505" y="330" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">la consecuencia y retorno a primera persona.</text>
<rect x="45" y="401" width="1710" height="113" fill="white" stroke="#d3dbe0" stroke-width="1" rx="6"/>
<rect x="45" y="401" width="9" height="113" fill="#cf343f" stroke="none" stroke-width="1" />
<text x="70" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#cf343f">T2 · ALARMA HUMANA</text>
<text x="70" y="458" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#172838">Recuperación de T1 · fuera de plano</text>
<text x="505" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">T1 se levanta, recorre una ruta física hasta P y pulsa. Solo entonces suena la alarma y arranca la respuesta de seguridad. El</text>
<text x="505" y="453" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">retraso concede ventaja a Elena; no mostrarlo como sensor automático.</text>
<rect x="45" y="524" width="1710" height="113" fill="white" stroke="#d3dbe0" stroke-width="1" rx="6"/>
<rect x="45" y="524" width="9" height="113" fill="#813cb3" stroke="none" stroke-width="1" />
<text x="70" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#813cb3">T3 · ARMARIO</text>
<text x="70" y="581" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#172838">X morada · interacción ambiental 2</text>
<text x="505" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">Aviso de interacción. Elena derriba el armario sobre el corredor. T2 y T3 quedan detrás sin ruta lateral que lo evite. Plano</text>
<text x="505" y="576" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">breve hacia atrás; vuelta a primera persona y continuación.</text>
<rect x="45" y="647" width="1710" height="113" fill="white" stroke="#d3dbe0" stroke-width="1" rx="6"/>
<rect x="45" y="647" width="9" height="113" fill="#238753" stroke="none" stroke-width="1" />
<text x="70" y="677" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#238753">T4 · SEGURIDAD</text>
<text x="70" y="704" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#172838">G1 y G2 · respuesta a ALARM_ACTIVE</text>
<text x="505" y="677" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">Dos guardias se desplazan desde su área. Debe transcurrir un tiempo de respuesta creíble. Coordinación con el avance del</text>
<text x="505" y="699" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">jugador, sin aparición instantánea delante de la cámara.</text>
<rect x="45" y="770" width="1710" height="113" fill="white" stroke="#d3dbe0" stroke-width="1" rx="6"/>
<rect x="45" y="770" width="9" height="113" fill="#238753" stroke="none" stroke-width="1" />
<text x="70" y="800" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#238753">T5 · EXTINTOR</text>
<text x="70" y="827" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#172838">X verde · interacción ambiental 3</text>
<text x="505" y="800" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">Aviso para recoger. G1/G2 bloquean el paso. Elena recoge, descarga, crea una nube, ciega a ambos y los golpea mientras están</text>
<text x="505" y="822" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">desorientados. Breve plano del resultado y regreso a primera persona.</text>
<rect x="45" y="893" width="1710" height="113" fill="white" stroke="#d3dbe0" stroke-width="1" rx="6"/>
<rect x="45" y="893" width="9" height="113" fill="#ef850d" stroke="none" stroke-width="1" />
<text x="70" y="923" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#ef850d">T6 · SALIDA</text>
<text x="70" y="950" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#172838">Sector D → A2 → A3 → carretera → bosque</text>
<text x="505" y="923" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">Guardias neutralizados, trabajadores retenidos por el armario. Carrera final con menor presión inmediata. Ascenso por</text>
<text x="505" y="945" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">conducción seca; salida física y ocultación en el bosque.</text>
<text x="45" y="1050" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#172838">CONTRATO DE PERSONAJES</text>
<text x="45" y="1080" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">T1: cae → se levanta → va al pulsador → activa la alarma. T2/T3: saltan la estantería → persiguen → quedan bloqueados por el armario. G1/G2: responden a la alarma →</text>
<text x="45" y="1103" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">bloquean → pierden visión → reciben los golpes → quedan incapacitados para perseguir.</text>
<text x="45" y="1175" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#172838">CONTRATO DE CÁMARA</text>
<text x="45" y="1205" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">Primera persona durante el desplazamiento. Tres insertos breves, motivados por las interacciones; deben mostrar causa y consecuencia sin convertir la huida en cinemáticas</text>
<text x="45" y="1228" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">largas. Retorno a la misma posición física, conservando orientación y control, sin teletransportes ni giros involuntarios. La duración de cada inserto se ajusta con</text>
<text x="45" y="1251" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172838">playtest; no se declara aprobada aquí.</text>
<text x="45" y="1370" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#526677">DISEÑO DE VIDEOJUEGO · Cotas objetivo · No validado en Godot · Sin cambios en el repositorio</text>
<text x="1755" y="1370" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#526677">2/4 · Rev. V1 · 17-10-2026</text>
</svg>