<rect x="900" y="970" width="250" height="120" fill="#e5dcf6" stroke="#7356ad" stroke-width="4"/><text class="roomlabel" x="1025" y="1018"><tspan x="1025">ZONA DE PERSONAL</tspan><tspan x="1025" dy="19">ELENA / DESCUBRIMIENTO</tspan></text>
<text x="510" y="1068" class="dim">J0 · bifurcación narrativa</text><text x="510" y="1088" class="small">derecha: personal · izquierda/continuación: salida clandestina</text>
