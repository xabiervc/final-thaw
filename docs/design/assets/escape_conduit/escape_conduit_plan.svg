<rect x="626" y="590" width="48" height="18" fill="#b45309" stroke="#78350f" stroke-width="2"/><text x="610" y="570" class="small">O1 · tubería 0,55 m</text>
<rect x="733" y="420" width="34" height="20" fill="#9a6a3a" stroke="#78350f" stroke-width="2"/><text x="775" y="430" class="small">O2 · viga baja</text>
