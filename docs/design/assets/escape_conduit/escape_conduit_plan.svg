<rect x="1035" y="65" width="30" height="52" fill="#52616a" stroke="#26353d" stroke-width="3"/><text x="1075" y="55" class="dim">BOCA / COMPUERTA</text>
<path d="M1320 90 L1460 90" stroke="#657681" stroke-width="34"/><path d="M1320 90 L1460 90" stroke="#dce5e8" stroke-width="26"/><text x="1380" y="62" text-anchor="middle" class="dim">CARRETERA SECUNDARIA</text>
<rect x="1460" y="125" width="300" height="260" rx="12" fill="#dcebdc" stroke="#64836b" stroke-width="3"/>
<g fill="#75a274" stroke="#54805b" stroke-width="2"><circle cx="1500" cy="165" r="28"/><circle cx="1560" cy="205" r="36"/><circle cx="1630" cy="160" r="31"/><circle cx="1700" cy="220" r="35"/><circle cx="1515" cy="285" r="32"/><circle cx="1600" cy="305" r="28"/><circle cx="1685" cy="310" r="32"/><circle cx="1730" cy="155" r="22"/></g>
<text x="1610" y="415" class="roomlabel">BOSQUE · REFUGIO FINAL</text><text x="1610" y="438" class="small" text-anchor="middle">ocultarse fuera del campo visual</text>
<!-- route labels -->
<text x="510" y="920" class="dim">E01 · acceso desde sótano</text><text x="510" y="895" class="small">puerta de transferencia / personal activo</text>
<text x="510" y="820" class="dim">E02 · galería de distribución</text><text x="510" y="795" class="small">giro y primer ramal recuperable</text>
<text x="665" y="590" class="dim">J1 · cruce de bombas</text><text x="670" y="570" class="small">tubería saltables + nicho opcional</text>
<text x="670" y="425" class="dim">J2 · galería norte</text><text x="670" y="405" class="small">viga baja; lectura por luz y continuidad</text>
<text x="770" y="165" class="dim">E03 · galería ascendente</text><text x="770" y="185" class="small">conducción seca hacia la ladera</text>
<text x="930" y="115" class="dim">E04 · aproximación a la boca</text>
<!-- compass -->
<path d="M70 180 V120 M60 135 L70 120 L80 135" fill="none" stroke="#253a43" stroke-width="3"/><text x="70" y="205" text-anchor="middle" class="dim">N</text>
<!-- legend -->
<rect x="50" y="1150" width="1700" height="95" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<line x1="80" y1="1180" x2="135" y2="1180" stroke="#ffe8a3" stroke-width="20"/><line x1="80" y1="1180" x2="135" y2="1180" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 6"/><text x="150" y="1185" class="small">ruta principal iluminada de forma continua</text>
<line x1="480" y1="1180" x2="535" y2="1180" stroke="#9aa4aa" stroke-width="18"/><text x="550" y="1185" class="small">galería secundaria / desvío</text>
<rect x="825" y="1168" width="18" height="24" fill="#b45309"/><text x="855" y="1185" class="small">obstáculo de traversal</text>
<rect x="1120" y="1168" width="20" height="24" fill="#e5dcf6" stroke="#7356ad"/><text x="1150" y="1185" class="small">rama narrativa de personal</text>
<text x="80" y="1220" class="note">Diseño de nivel: las salas explican la función del complejo; los desvíos tienen lógica espacial; las cotas, anchos y colisiones se cerrarán con el greybox 3D y pruebas de movimiento.</text>
</svg>