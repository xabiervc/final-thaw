<path class="branch" d="M490 850 L370 850 L370 955 M650 615 L760 615 L810 615 M750 445 L910 445 L910 485"/>
<path class="branchline" d="M490 850 L370 850 L370 955 M650 615 L760 615 L810 615 M750 445 L910 445 L910 485"/>
<rect x="345" y="945" width="50" height="20" class="dark"/><text x="330" y="988" class="small">D1 · fondo de mantenimiento</text>
<rect x="798" y="600" width="22" height="30" class="dark"/><text x="770" y="655" class="small">D2 · nicho ciego</text>
<rect x="898" y="474" width="24" height="24" class="dark"/><text x="925" y="490" class="small">D3 · pasillo bloqueado</text>
