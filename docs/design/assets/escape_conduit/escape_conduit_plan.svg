<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
<defs>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dce1e5" stroke-width="1"/></pattern>
 <pattern id="wall" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#737b80" stroke-width="1.5"/></pattern>
 <style>
 .title{font:700 30px sans-serif;fill:#182b35}.sub{font:16px sans-serif;fill:#52636b}.room{fill:#edf1f3;stroke:#35434a;stroke-width:4}.roomlabel{font:700 15px sans-serif;fill:#243c46;text-anchor:middle}.small{font:13px sans-serif;fill:#334b55}.tiny{font:12px sans-serif;fill:#334b55}.dim{font:700 13px sans-serif;fill:#344b55}.main{fill:none;stroke:#ffe8a3;stroke-width:30;stroke-linecap:square;stroke-linejoin:round}.center{fill:none;stroke:#d97706;stroke-width:3;stroke-dasharray:11 8;stroke-linecap:round;stroke-linejoin:round}.branch{fill:none;stroke:#9aa4aa;stroke-width:22;stroke-linecap:square;stroke-linejoin:round}.branchline{fill:none;stroke:#66747c;stroke-width:2;stroke-dasharray:6 7}.door{fill:#fff0b3;stroke:#8b6a28;stroke-width:1.5}.node{fill:#fff8dd;stroke:#b7791f;stroke-width:3}.dark{fill:#4b5660;stroke:#303b42;stroke-width:2}.note{font:14px sans-serif;fill:#263f49}
 </style>
</defs>
<rect width="1800" height="1280" fill="#f7f8f5"/><rect width="1800" height="1280" fill="url(#grid)"/>
<text x="48" y="52" class="title">FINAL THAW — FASE 1 · HUÍDA POR INSTALACIÓN TÉCNICA</text>
<text x="48" y="80" class="sub">Planta conceptual revisada · lenguaje de planta industrial existente · dimensiones orientativas, no plano de obra</text>
<!-- main facility boundary -->
<rect x="110" y="130" width="1120" height="1000" fill="#e6e3dc" stroke="#28353b" stroke-width="10"/>
<rect x="110" y="130" width="1120" height="1000" fill="url(#wall)" opacity=".75"/>
<!-- rooms -->
<rect class="room" x="150" y="180" width="210" height="145"/><text class="roomlabel" x="255" y="240"><tspan x="255">ARCHIVO</tspan><tspan x="255" dy="19">TÉCNICO</tspan></text>
<rect class="room" x="150" y="350" width="210" height="170"/><text class="roomlabel" x="255" y="420"><tspan x="255">TALLER</tspan><tspan x="255" dy="19">MECÁNICO</tspan></text>
<rect class="room" x="150" y="545" width="210" height="185"/><text class="roomlabel" x="255" y="620"><tspan x="255">ALMACÉN DE</tspan><tspan x="255" dy="19">REPUESTOS</tspan></text>
<rect class="room" x="150" y="755" width="210" height="150"/><text class="roomlabel" x="255" y="815"><tspan x="255">CUARTO DE</tspan><tspan x="255" dy="19">BATERÍAS</tspan></text>
<rect class="room" x="390" y="180" width="190" height="125"/><text class="roomlabel" x="485" y="235"><tspan x="485">OFICINA</tspan><tspan x="485" dy="19">TÉCNICA</tspan></text>
<rect class="room" x="390" y="330" width="190" height="175"/><text class="roomlabel" x="485" y="405"><tspan x="485">VESTUARIO DE</tspan><tspan x="485" dy="19">MANTENIMIENTO</tspan></text>
<rect class="room" x="390" y="530" width="190" height="170"/><text class="roomlabel" x="485" y="600"><tspan x="485">SALA DE</tspan><tspan x="485" dy="19">BOMBAS</tspan></text>
<rect class="room" x="600" y="180" width="250" height="180"/><text class="roomlabel" x="725" y="260"><tspan x="725">TRANSFORMADORES</tspan><tspan x="725" dy="19">Y CUADROS ELÉCTRICOS</tspan></text>
<rect class="room" x="870" y="180" width="300" height="145"/><text class="roomlabel" x="1020" y="240"><tspan x="1020">CONTROL DE</tspan><tspan x="1020" dy="19">COMPRESORES</tspan></text>
<rect class="room" x="870" y="350" width="300" height="150"/><text class="roomlabel" x="1020" y="410"><tspan x="1020">CUARTO DE</tspan><tspan x="1020" dy="19">VÁLVULAS</tspan></text>
<rect class="room" x="870" y="525" width="300" height="205"/><text class="roomlabel" x="1020" y="615"><tspan x="1020">SALA DE CONTROL</tspan><tspan x="1020" dy="19">DE BOMBEO</tspan></text>
<rect class="room" x="390" y="725" width="190" height="180"/><text class="roomlabel" x="485" y="800"><tspan x="485">CONTROL DE</tspan><tspan x="485" dy="19">ACCESO</tspan></text>
