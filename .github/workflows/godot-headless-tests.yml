name: Godot headless tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feat/godot-vertical-slice
  push:
    branches:
      - main
      - feat/godot-vertical-slice

permissions:
  contents: read

jobs:
  headless-tests:
    name: Import project and run regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Phase 0 regression
        run: godot --headless --path . res://tests/test_phase_0.tscn

      - name: Existing vertical slice regression
        run: godot --headless --path . res://tests/test_vertical_slice.tscn

      - name: Phase 1 circuit contract
        run: godot --headless --path . res://tests/test_phase1_circuit_model.tscn

      - name: Generic service lift
        run: godot --headless --path . res://tests/test_service_lift.tscn

      - name: Service lift transport
        run: godot --headless --path . res://tests/test_service_lift_transport.tscn

      - name: Canonical Phase 1 integration
        run: godot --headless --path . res://tests/test_phase1_canonical_greybox.tscn

      - name: Phase 2 parking-entry handoff
        run: godot --headless --path . res://tests/test_phase2_parking_entry.tscn
